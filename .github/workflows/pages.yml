name: Deploy to GitHub Pages

# Publica la app (HTML único generado por Vite) en GitHub Pages SOLO cuando el
# workflow de CI (typecheck + lint + tests + e2e + build) ha terminado en verde
# sobre `main`. Así un build roto nunca llega a producción. El build inlina todo en
# dist/index.html, de modo que funciona en el subpath del repo sin configurar `base`.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Despliega solo si CI pasó (o si se lanza manualmente). Sin esta puerta, un push
    # con tests en rojo publicaría igualmente.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build single-file HTML
        run: npm run build

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
